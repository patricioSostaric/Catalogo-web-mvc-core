services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Catalogo@Dev2024"
    ports:
      # Se expone al host para poder conectarse con SSMS o Azure Data Studio.
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # La app no debe arrancar hasta que SQL Server acepte conexiones, o las
      # migraciones fallan contra un motor que todavía está inicializando.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Único servicio publicado al host: el gateway es la puerta de entrada, igual que
  # en una arquitectura real. Que web y api no expongan puertos no es un descuido,
  # es lo que obliga a que todo el tráfico pase por el proxy.
  gateway:
    build:
      context: .
      dockerfile: Catalogo.Gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Los destinos se pisan por variable de entorno: en la máquina apuntan a
      # localhost y acá a los nombres de servicio que resuelve la red de Compose.
      ReverseProxy__Clusters__mvc__Destinations__destino1__Address: "http://web:8080/"
      ReverseProxy__Clusters__api__Destinations__destino1__Address: "http://api:8080/"
    depends_on:
      - web
      - api

  web:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # El doble guion bajo es como .NET mapea secciones anidadas de configuración.
      # TrustServerCertificate es necesario porque el contenedor de SQL usa un cert autofirmado.
      ConnectionStrings__CatalogoDB: "Server=db,1433;Database=CatalogoDB;User Id=sa;Password=Catalogo@Dev2024;TrustServerCertificate=True;"
      # Las dos aplicaciones cifran y descifran la cookie de sesión con el mismo
      # juego de claves, que se guarda en un volumen compartido.
      DataProtection__RutaClaves: /claves
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Los avatares subidos sobreviven al recreado del contenedor.
      - uploads:/app/wwwroot/uploads
      - claves:/claves

  api:
    build:
      context: .
      dockerfile: Catalogo.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CatalogoDB: "Server=db,1433;Database=CatalogoDB;User Id=sa;Password=Catalogo@Dev2024;TrustServerCertificate=True;"
      DataProtection__RutaClaves: /claves
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - claves:/claves

volumes:
  sqldata:
  uploads:
  claves:
