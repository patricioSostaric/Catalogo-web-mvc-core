services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Catalogo@Dev2024"
    ports:
      # Se expone al host para poder conectarse con SSMS o Azure Data Studio.
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      # La app no debe arrancar hasta que SQL Server acepte conexiones, o las
      # migraciones fallan contra un motor que todavía está inicializando.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # El doble guion bajo es como .NET mapea secciones anidadas de configuración.
      # TrustServerCertificate es necesario porque el contenedor de SQL usa un cert autofirmado.
      ConnectionStrings__CatalogoDB: "Server=db,1433;Database=CatalogoDB;User Id=sa;Password=Catalogo@Dev2024;TrustServerCertificate=True;"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Los avatares subidos sobreviven al recreado del contenedor.
      - uploads:/app/wwwroot/uploads

volumes:
  sqldata:
  uploads:
